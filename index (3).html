<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JewelKart</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#7a4a10">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="icon" href="/icon-192.png">
<style>
:root{--bg:#fdf6e8;--card:#fffdf8;--ink:#2e2010;--mute:#7d6a52;--maroon:#7a4a10;--gold:#c8923a;--goldl:#f6e3bf;--line:#ecdcbc}
@media (prefers-color-scheme:dark){:root{--bg:#1b140b;--card:#261c10;--ink:#f6ecda;--mute:#b8a68a;--maroon:#e0b45a;--gold:#c8923a;--goldl:#4a3a18;--line:#3d2e19}
.tab.on,.btn.pri,#botb,.bm.me{color:#1b140b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:0 16px 80px}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;margin:0;color:var(--maroon)}
header{padding:18px 0 4px;display:flex;justify-content:space-between;align-items:center;gap:8px}
header h1{font-size:30px}
button,input,select{font:inherit}
button{cursor:pointer}
.tabs{display:flex;gap:8px;margin:10px 0}
.tab{flex:1;padding:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px}
.tab.on{background:var(--maroon);color:#fff;border-color:var(--maroon)}
.brand{display:flex;align-items:center;gap:10px}
.rate{background:var(--goldl);border-radius:10px;padding:10px 14px;font-size:14px}
input,select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0}
.chip{white-space:nowrap;padding:7px 14px;border:1px solid var(--line);border-radius:20px;background:var(--card);color:var(--ink)}
.chip.on{background:var(--gold);color:#fff;border-color:var(--gold)}
.shop{display:flex;gap:12px;padding:14px;margin:10px 0;background:var(--card);border:1px solid var(--line);border-radius:14px;cursor:pointer}
.logo{flex:none;width:52px;height:52px;border-radius:50%;background:var(--maroon);color:var(--goldl);display:grid;place-items:center;font:700 22px Georgia,serif}
.shop h3{font-size:20px}
.meta{font-size:13px;color:var(--mute)}
.badge{display:inline-block;font-size:12px;padding:1px 8px;border-radius:10px;background:var(--goldl);color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.prod{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer}
.ph{height:120px;display:grid;place-items:center;font-size:40px;background:linear-gradient(135deg,var(--goldl),var(--card));overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.big{height:220px;border-radius:14px}
.prod .i{padding:10px}
.price{color:var(--maroon);font-weight:700}
.btns{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap}
.btn{flex:1;min-width:90px;text-align:center;text-decoration:none;padding:12px;border-radius:10px;border:1px solid var(--maroon);color:var(--maroon);background:transparent;font-weight:600}
.btn.wa{background:#1f8f4e;border-color:#1f8f4e;color:#fff}
.btn.pri{background:var(--maroon);color:#fff}
.back{background:none;border:0;color:var(--maroon);font-weight:600;padding:8px 0}
table{width:100%;border-collapse:collapse;margin:8px 0}
td{padding:8px 0;border-bottom:1px solid var(--line)}td:last-child{text-align:right;font-weight:600}
label{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.row button{padding:6px 12px;border-radius:8px;border:1px solid var(--maroon);background:none;color:var(--maroon)}
.empty{padding:24px 0;color:var(--mute);text-align:center}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--maroon);color:#fff;padding:10px 18px;border-radius:20px;font-size:14px;max-width:90%}
.ord{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px;margin:10px 0}
.ord .btns{margin:8px 0 0}.ord button.btn{background:none}
#botb{position:fixed;right:16px;bottom:16px;width:54px;height:54px;border-radius:50%;border:0;background:var(--maroon);color:#fff;font-size:24px;box-shadow:0 4px 14px rgba(0,0,0,.25);z-index:20}
#bot{position:fixed;right:12px;bottom:82px;width:min(380px,calc(100vw - 24px));height:min(480px,65vh);background:var(--card);border:1px solid var(--line);border-radius:16px;display:flex;flex-direction:column;z-index:20;overflow:hidden}
#bot[hidden]{display:none}
#bot .bh{padding:10px 14px;border-bottom:1px solid var(--line);font-weight:600;color:var(--maroon)}
#bmsg{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.bm{max-width:85%;padding:8px 12px;border-radius:14px;background:var(--goldl);align-self:flex-start;white-space:pre-wrap;font-size:15px}
.bm.me{background:var(--maroon);color:#fff;align-self:flex-end}
#bot .bi{display:flex;gap:8px;padding:8px;border-top:1px solid var(--line)}
#bot .bi button{border:0;border-radius:10px;padding:0 16px;background:var(--maroon);color:#fff}
</style>
</head>
<body>
<div class="wrap">
<header><div class="brand"><img src="/logo-mark.png" alt="" width="44" height="44"><h1>JewelKart</h1></div><div style="display:flex;gap:8px"><button class="chip" id="cartb" data-a="cart">🛒 0</button><button class="chip" id="auth">Sign in</button></div></header>
<div class="tabs" id="tabs"></div>
<div class="rate" id="rate"></div>
<main id="app"></main>
</div>
<button id="botb" aria-label="Chat with JewelKart assistant">💬</button>
<div id="bot" hidden><div class="bh">JewelKart assistant</div><div id="bmsg"></div><div class="bi"><input id="bin" placeholder="Ask about rates, shops, hallmark…" maxlength="300"><button id="bsend">Send</button></div></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,GoogleAuthProvider,signInWithPopup,signOut,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,collection,doc,getDoc,getDocs,addDoc,setDoc,updateDoc,deleteDoc,query,where} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app=initializeApp({apiKey:"AIzaSyBZ0kqTG5FFtM_PIZjVFn31HRtIuf7IjOs",authDomain:"jewel-nearby.firebaseapp.com",projectId:"jewel-nearby",storageBucket:"jewel-nearby.firebasestorage.app",messagingSenderId:"141846446703",appId:"1:141846446703:web:a1990707c90b3132b5039a"});
const auth=getAuth(app),db=getFirestore(app);
const $=i=>document.getElementById(i);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const inr=n=>"₹"+Math.round(n).toLocaleString("en-IN");
const S={me:null,admin:false,mine:null,shops:[],rate:{},pos:null,view:"home",f:"All",q:"",shop:null,prods:[],cat:"All",prod:null,photo:"",cart:[],orders:[],sorders:[]};
try{S.cart=JSON.parse(localStorage.getItem("jk.cart")||"[]")}catch(e){}
const toast=t=>{const d=document.createElement("div");d.className="toast";d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2600)};
const guard=async fn=>{try{await fn()}catch(e){console.error(e);toast(e.code==="permission-denied"?"Not allowed. Sign in first.":e.code==="auth/unauthorized-domain"?"Add this site to Firebase Authentication > Settings > Authorized domains":"Something went wrong. Try again.")}};
const docs=sn=>sn.docs.map(d=>({id:d.id,...d.data()}));

function dist(s){if(!S.pos||s.lat==null)return null;const r=x=>x*Math.PI/180,a=Math.sin(r(s.lat-S.pos.lat)/2)**2+Math.cos(r(S.pos.lat))*Math.cos(r(s.lat))*Math.sin(r(s.lng-S.pos.lng)/2)**2;return 12742*Math.asin(Math.sqrt(a))}
function price(p){const r=p.m==="Silver"?S.rate.silver:(S.rate.gold24?S.rate.gold24*p.p/24:null);if(!r)return null;const b=p.w*r,mk=b*p.mk/100;return{b,mk,g:(b+mk)*.03,t:(b+mk)*1.03}}
const purity=p=>p.m==="Silver"?"Silver":p.p+"K gold";
const pic=p=>p.photo?`<img src="${p.photo}" alt="${esc(p.n)}">`:"💍";

async function loadRate(){let r={};try{const d=await getDoc(doc(db,"rates","today"));r=d.exists()?d.data():{}}catch(e){}
 S.rateRaw=r;S.rate={...r};S.rateNote="";
 if(r.auto){try{const j=await(await fetch("/api/rates")).json();if(j.gold24>0){const f=1+(+r.adj||0)/100;S.rate.gold24=j.gold24*f;S.rate.silver=j.silver>0?j.silver*f:r.silver;S.rateNote="Auto-updated "+new Date(j.updated).toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit"})}}catch(e){}}
 $("rate").innerHTML=S.rate.gold24?`Today’s gold 24K: <b>${inr(S.rate.gold24)}/g</b> · 22K: <b>${inr(S.rate.gold24*22/24)}/g</b>`+(S.rate.silver?` · Silver: <b>${inr(S.rate.silver)}/g</b>`:"")+(S.rateNote?` <span class="meta">(${S.rateNote})</span>`:""):"Today’s rate not set yet. Prices will show once the admin sets it."}
async function loadShops(){S.shops=docs(await getDocs(query(collection(db,"shops"),where("verified","==",true))))}
async function loadMine(){S.mine=null;if(!S.me)return;const l=docs(await getDocs(query(collection(db,"shops"),where("ownerId","==",S.me.uid))));S.mine=l[0]||null}
async function loadProds(id){S.prods=docs(await getDocs(query(collection(db,"products"),where("shopId","==",id)))).sort((a,b)=>a.t-b.t)}

function tabs(){const t=[["home","Shops"],["orders","Orders"],["mine","My shop"]];if(S.admin)t.push(["admin","Admin"]);
 $("tabs").innerHTML=t.map(x=>`<button class="tab${(S.view===x[0]||(x[0]==="home"&&["shop","prod"].includes(S.view)))?" on":""}" data-a="go" data-v="${x[0]}">${x[1]}</button>`).join("");
 $("auth").textContent=S.me?"Sign out":"Sign in";$("cartb").textContent="🛒 "+S.cart.length}

function home(){S.view="home";tabs();
 let l=S.shops.filter(s=>(S.f==="All"||(s.metals||[]).includes(S.f))&&(!S.q||(s.name+" "+s.area).toLowerCase().includes(S.q.toLowerCase())));
 l=l.map(s=>({...s,d:dist(s)})).sort((a,b)=>S.pos?((a.d??1e9)-(b.d??1e9)):a.name.localeCompare(b.name));
 let h=`<input id="q" placeholder="Search jeweller or area" value="${esc(S.q)}"><div class="chips">`+["All","Gold","Silver"].map(f=>`<button class="chip${S.f===f?" on":""}" data-a="f" data-f="${f}">${f}</button>`).join("")+`<button class="chip${S.pos?" on":""}" data-a="near">Near me</button></div>`;
 if(!l.length)h+=`<div class="empty">No verified shops yet. Jewellers can register under “My shop”.</div>`;
 l.forEach(s=>h+=`<div class="shop" data-a="shop" data-id="${s.id}"><div class="logo">${esc(s.name[0])}</div><div><h3>${esc(s.name)}</h3><div class="meta">${esc(s.area)}${s.d!=null?" · "+s.d.toFixed(1)+" km":""} · ${esc(s.hours)}</div><span class="badge">✔ Verified</span></div></div>`);
 $("app").innerHTML=h;const q=$("q");q.oninput=e=>{S.q=e.target.value;const p=e.target.selectionStart;home();const n=$("q");n.focus();n.setSelectionRange(p,p)}}

function shopPg(){S.view="shop";tabs();const s=S.shop;
 const cats=["All",...new Set(S.prods.map(p=>p.c))];
 let h=`<button class="back" data-a="go" data-v="home">← All shops</button><h2>${esc(s.name)}</h2><div class="meta">${esc(s.area)} · ${esc(s.hours)}</div><span class="badge">✔ Verified</span>
 <div class="btns"><a class="btn wa" target="_blank" rel="noopener" href="https://wa.me/${esc(s.phone)}?text=${encodeURIComponent("Hi "+s.name+", I found you on JewelKart.")}">WhatsApp</a><a class="btn" href="tel:+${esc(s.phone)}">Call</a><a class="btn" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${s.lat!=null?s.lat+","+s.lng:encodeURIComponent(s.name+" "+s.area)}">Directions</a></div>
 <div class="chips">`+cats.map(c=>`<button class="chip${S.cat===c?" on":""}" data-a="cat" data-c="${esc(c)}">${esc(c)}</button>`).join("")+`</div><div class="grid">`;
 const v=S.prods.filter(p=>S.cat==="All"||p.c===S.cat);
 v.forEach(p=>{const pr=price(p);h+=`<div class="prod" data-a="prod" data-id="${p.id}"><div class="ph">${pic(p)}</div><div class="i"><b>${esc(p.n)}</b><div class="meta">${purity(p)} · ${p.w} g</div><div class="price">${pr?inr(pr.t):"Ask shop"}</div></div></div>`});
 h+="</div>";if(!v.length)h+=`<div class="empty">No products here yet.</div>`;$("app").innerHTML=h}

function prodPg(){S.view="prod";const s=S.shop,p=S.prod,pr=price(p);
 let h=`<button class="back" data-a="shopback">← ${esc(s.name)}</button><div class="ph big">${pic(p)}</div><h2>${esc(p.n)}</h2><div class="meta">${esc(p.c)} · ${esc(s.name)}</div><table><tr><td>Metal</td><td>${purity(p)}</td></tr><tr><td>Weight</td><td>${p.w} g</td></tr>`;
 h+=pr?`<tr><td>Metal value</td><td>${inr(pr.b)}</td></tr><tr><td>Making charge (${p.mk}%)</td><td>${inr(pr.mk)}</td></tr><tr><td>GST (3%)</td><td>${inr(pr.g)}</td></tr><tr><td>Estimated price</td><td class="price">${inr(pr.t)}</td></tr>`:`<tr><td>Price</td><td>Ask the shop</td></tr>`;
 h+=`</table>${pr?'<div class="btns"><button class="btn pri" data-a="addcart">Add to cart · '+inr(pr.t)+'</button></div>':""}<div class="btns"><a class="btn wa" target="_blank" rel="noopener" href="https://wa.me/${esc(s.phone)}?text=${encodeURIComponent("Hi, I’m interested in "+p.n+" ("+purity(p)+", "+p.w+" g) seen on JewelKart.")}">Enquire on WhatsApp</a><a class="btn" href="tel:+${esc(s.phone)}">Call shop</a></div><div class="meta">Estimated price. The shop’s final price may differ.</div>`;
 $("app").innerHTML=h}

async function mine(){S.view="mine";tabs();
 if(!S.me){$("app").innerHTML=`<h2>Jewellers</h2><p>Sign in with Google to register your shop and add products.</p><div class="btns"><button class="btn pri" data-a="auth">Sign in with Google</button></div>`;return}
 if(!S.mine){$("app").innerHTML=`<h2>Register your shop</h2><label>Shop name</label><input id="sn"><label>Area or locality</label><input id="sa"><label>WhatsApp number with country code</label><input id="sph" type="tel" inputmode="numeric" placeholder="919812345678"><label>Opening hours</label><input id="sh" placeholder="10am–8pm"><label>UPI ID to receive payments (optional)</label><input id="supi" placeholder="shopname@upi"><label>You sell</label><select id="sm"><option>Gold</option><option>Silver</option><option>Gold and silver</option></select><input id="slat" type="hidden"><input id="slng" type="hidden"><div class="btns"><button class="btn" data-a="loc" id="locb">Use shop location (stand in your shop)</button></div><div class="btns"><button class="btn pri" data-a="saveshop">Save shop</button></div><div class="meta">New shops are shown to customers after the admin verifies them.</div>`;return}
 await loadProds(S.mine.id);await loadShopOrders();const s=S.mine;
 let h=`<h2>${esc(s.name)}</h2><div class="meta">${esc(s.area)}</div>${s.verified?'<span class="badge">✔ Verified, visible to customers</span>':'<span class="badge">Waiting for verification</span>'}<h3 style="margin-top:18px">Orders (${S.sorders.length})</h3>${S.sorders.length?S.sorders.map(o=>ordCard(o,true)).join(""):'<div class="meta">No orders yet.</div>'}<h3 style="margin-top:18px">Payments (UPI)</h3><label>Your UPI ID</label><input id="supi2" value="${esc(s.upiId||"")}"><div class="btns"><button class="btn" data-a="saveupi">Save UPI ID</button></div><h3 style="margin-top:18px">Add product</h3>
 <label>Photo</label><input id="pf" type="file" accept="image/*"><div class="ph" id="pv" style="height:140px;margin-top:8px;border-radius:12px">📷</div><label>Product name</label><input id="on"><label>Category</label><select id="oc"><option>Rings</option><option>Chains</option><option>Earrings</option><option>Bangles</option><option>Other</option></select><label>Metal</label><select id="om"><option>Gold</option><option>Silver</option></select><label>Purity (karat, gold only)</label><select id="op"><option>22</option><option>24</option><option>18</option><option>14</option></select><label>Weight (grams)</label><input id="ow" type="number" inputmode="decimal"><label>Making charge (%)</label><input id="ok" type="number" inputmode="decimal" value="8"><div class="btns"><button class="btn pri" data-a="saveprod">Save product</button></div><h3>Your products (${S.prods.length})</h3>`;
 S.prods.forEach(p=>h+=`<div class="row"><span>${esc(p.n)} · ${p.w} g</span><button data-a="delprod" data-id="${p.id}">Delete</button></div>`);
 $("app").innerHTML=h;
 $("pf").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,520/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);S.photo=c.toDataURL("image/jpeg",.6);$("pv").innerHTML=`<img src="${S.photo}" alt="Preview">`};im.onerror=()=>toast("Could not read that photo");im.src=r.result};r.readAsDataURL(f)}}

async function adminPg(){S.view="admin";tabs();
 const all=docs(await getDocs(collection(db,"shops")));const R=S.rateRaw||{};
 let h=`<h2>Today’s rate (₹ per gram)</h2><label>Mode</label><select id="rm"><option value="manual"${R.auto?"":" selected"}>Manual (I type the rate)</option><option value="auto"${R.auto?" selected":""}>Auto (market price + adjustment)</option></select><label>Gold 24K, manual</label><input id="g24" type="number" inputmode="decimal" value="${R.gold24||""}"><label>Silver, manual</label><input id="sv" type="number" inputmode="decimal" value="${R.silver||""}"><label>Auto: adjustment % over market price (duty and local premium)</label><input id="adj" type="number" inputmode="decimal" value="${R.adj||0}"><div class="btns"><button class="btn" data-a="prevauto">Preview auto rate</button><button class="btn pri" data-a="saverate">Save rate</button></div><div class="meta" id="prevbox"></div><h3>Shops (${all.length})</h3>`;
 all.forEach(s=>h+=`<div class="row"><span>${esc(s.name)}<br><span class="meta">${esc(s.area)} · ${esc(s.phone)} · ${s.verified?"Verified":"Pending"}</span></span><button data-a="verify" data-id="${s.id}" data-v="${s.verified?0:1}">${s.verified?"Unverify":"Approve"}</button></div>`);
 if(!all.length)h+=`<div class="empty">No shops registered yet.</div>`;$("app").innerHTML=h}

const val=i=>$(i).value.trim();
const act={
 go:async d=>guard(async()=>{if(d.v==="home"){await loadShops();home()}else if(d.v==="orders")await ordersPg();else if(d.v==="mine")await mine();else await adminPg()}),
 f:d=>{S.f=d.f;home()},
 near:()=>navigator.geolocation?navigator.geolocation.getCurrentPosition(p=>{S.pos={lat:p.coords.latitude,lng:p.coords.longitude};home()},()=>toast("Allow location to sort by distance")):toast("Location not available"),
 shop:d=>guard(async()=>{S.shop=S.shops.find(s=>s.id===d.id);S.cat="All";await loadProds(d.id);shopPg()}),
 cat:d=>{S.cat=d.c;shopPg()},
 prod:d=>{S.prod=S.prods.find(p=>p.id===d.id);prodPg()},
 shopback:()=>shopPg(),
 auth:()=>$("auth").click(),
 loc:()=>navigator.geolocation?navigator.geolocation.getCurrentPosition(p=>{$("slat").value=p.coords.latitude;$("slng").value=p.coords.longitude;$("locb").textContent="Location saved ✔"},()=>toast("Allow location to save it")):toast("Location not available"),
 saveshop:()=>guard(async()=>{const n=val("sn"),a=val("sa"),ph=val("sph").replace(/\D/g,"");if(!n||!a)return toast("Add shop name and area");if(ph.length<10||ph.length>15)return toast("Enter number with country code");
  const m=$("sm").value,lat=val("slat"),lng=val("slng");
  await setDoc(doc(db,"shops",S.me.uid),{name:n,area:a,phone:ph,hours:val("sh")||"Ask shop",metals:m==="Gold and silver"?["Gold","Silver"]:[m],upiId:val("supi"),lat:lat?+lat:null,lng:lng?+lng:null,ownerId:S.me.uid,verified:false,t:Date.now()});
  await loadMine();toast("Shop saved. Add your products.");await mine()}),
 saveprod:()=>guard(async()=>{const n=val("on"),w=+val("ow");if(!n||!(w>0))return toast("Add a name and weight");
  await addDoc(collection(db,"products"),{shopId:S.me.uid,n,c:$("oc").value,m:$("om").value,p:+$("op").value,w,mk:+val("ok")||0,photo:S.photo,t:Date.now()});S.photo="";toast("Product saved");await mine()}),
 delprod:d=>guard(async()=>{if(!confirm("Delete this product?"))return;await deleteDoc(doc(db,"products",d.id));await mine()}),
 saverate:()=>guard(async()=>{const g=+val("g24"),s=+val("sv");if(!(g>0))return toast("Enter the gold rate");await setDoc(doc(db,"rates","today"),{gold24:g,silver:s>0?s:null,t:Date.now()});await loadRate();toast("Rate saved")}),
 verify:d=>guard(async()=>{await updateDoc(doc(db,"shops",d.id),{verified:d.v==="1"});await adminPg()})
};
const ST={placed:"Order placed",confirmed:"Confirmed by shop",ready:"Ready / shipped",completed:"Completed",cancelled:"Cancelled"};
const saveCart=()=>{try{localStorage.setItem("jk.cart",JSON.stringify(S.cart))}catch(e){}};
const cartTotal=()=>S.cart.reduce((a,i)=>{const p=price(i);return a+(p?p.t:0)},0);
async function loadOrders(){S.orders=docs(await getDocs(query(collection(db,"orders"),where("userId","==",S.me.uid)))).sort((a,b)=>b.t-a.t)}
async function loadShopOrders(){S.sorders=docs(await getDocs(query(collection(db,"orders"),where("shopId","==",S.me.uid)))).sort((a,b)=>b.t-a.t)}
function ordCard(o,shop){const code=o.id.slice(-6).toUpperCase(),b=[];
 const bt=(s,l)=>`<button class="btn" data-a="ost" data-id="${o.id}" data-s="${s}">${l}</button>`;
 if(shop){if(o.status==="placed")b.push(bt("confirmed","Confirm"));if(o.status==="confirmed")b.push(bt("ready","Mark ready"));if(o.status==="ready")b.push(bt("completed","Complete"));
  if(!o.paid&&o.status!=="cancelled")b.push(`<button class="btn" data-a="opaid" data-id="${o.id}">Payment received</button>`);
  if(o.status==="placed"||o.status==="confirmed")b.push(bt("cancelled","Cancel"))}
 else{if(o.status==="placed"&&!o.paid)b.push(bt("cancelled","Cancel order"));b.push(`<a class="btn" target="_blank" rel="noopener" href="https://wa.me/${esc(o.shopPhone)}?text=${encodeURIComponent("Hi, about my JewelKart order #"+code)}">Message shop</a>`)}
 const pay=o.paid?"Paid ✔":o.method==="upi"?"UPI ref "+esc(o.utr)+" (shop will confirm)":"Pay at shop";
 return `<div class="ord"><b>#${code}</b> · <span class="badge">${ST[o.status]||o.status}</span><div class="meta">${shop?esc(o.userName)+" · "+esc(o.userPhone):esc(o.shopName)} · ${new Date(o.t).toLocaleDateString("en-IN")}</div><div style="margin:6px 0">${o.items.map(i=>esc(i.n)+" ("+i.w+" g) "+inr(i.price)).join("<br>")}</div><div class="price">Total ${inr(o.total)}</div><div class="meta">${pay} · ${o.delivery==="home"?"Home delivery: "+esc(o.address):"Pickup from shop"}</div><div class="btns">${b.join("")}</div></div>`}
async function ordersPg(){S.view="orders";tabs();
 if(!S.me){$("app").innerHTML=`<h2>My orders</h2><p>Sign in to see your orders.</p><div class="btns"><button class="btn pri" data-a="auth">Sign in with Google</button></div>`;return}
 await loadOrders();$("app").innerHTML=`<h2>My orders</h2>`+(S.orders.length?S.orders.map(o=>ordCard(o,false)).join(""):`<div class="empty">No orders yet.</div>`)}
function cartPg(){S.view="cart";tabs();
 if(!S.cart.length){$("app").innerHTML=`<h2>Your cart</h2><div class="empty">Your cart is empty.</div>`;return}
 let h=`<h2>Your cart</h2><div class="meta">${esc(S.cart[0].shopName)}</div>`;
 S.cart.forEach((i,k)=>{const p=price(i);h+=`<div class="row"><span>${esc(i.n)}<br><span class="meta">${purity(i)} · ${i.w} g</span></span><span>${p?inr(p.t):"—"} <button data-a="rmcart" data-k="${k}">✕</button></span></div>`});
 h+=`<div class="row"><b>Total</b><b class="price">${inr(cartTotal())}</b></div><div class="btns"><button class="btn pri" data-a="checkout">Checkout</button></div><div class="meta">Priced at today’s rate. The shop confirms the final amount.</div>`;$("app").innerHTML=h}
function checkoutPg(){S.view="checkout";tabs();
 const c=S.cart[0],s=S.shops.find(x=>x.id===c.shopId),upi=s&&s.upiId,total=Math.round(cartTotal());
 $("app").innerHTML=`<h2>Checkout</h2><div class="meta">${esc(c.shopName)} · ${S.cart.length} item(s) · <b>${inr(total)}</b></div>
<label>Your name</label><input id="cn" value="${esc(S.me.displayName||"")}"><label>Phone</label><input id="cp" type="tel" inputmode="numeric" placeholder="9812345678">
<label>Delivery</label><select id="cd"><option value="pickup">Pick up from shop</option><option value="home">Home delivery (shop confirms charges)</option></select><label>Address (for home delivery)</label><input id="ca">
<label>Payment</label><select id="cm"><option value="shop">Pay at shop on pickup</option>${upi?'<option value="upi">Pay now by UPI</option>':""}</select>
<div id="upibox" style="display:none"><div class="btns"><a class="btn" href="upi://pay?pa=${encodeURIComponent(upi||"")}&pn=${encodeURIComponent(c.shopName)}&am=${total}&cu=INR&tn=${encodeURIComponent("JewelKart order")}">Open UPI app and pay ${inr(total)}</a></div><div class="meta">Pay to ${esc(upi||"")}. Then enter the 12-digit UPI reference (UTR) from your payment app.</div><label>UPI reference (UTR)</label><input id="cu" inputmode="numeric" maxlength="12"></div>
<div class="btns"><button class="btn pri" data-a="place">Place order</button></div><div class="meta">Your payment goes directly to the shop. JewelKart does not hold your money.</div>`;
 $("cm").onchange=()=>{$("upibox").style.display=$("cm").value==="upi"?"block":"none"}}
const reOrders=()=>S.view==="orders"?ordersPg():mine();
Object.assign(act,{
 cart:()=>cartPg(),
 addcart:()=>{const s=S.shop,p=S.prod;if(S.cart.length&&S.cart[0].shopId!==s.id){if(!confirm("Your cart has items from another shop. Clear it and add this?"))return;S.cart=[]}
  if(S.cart.some(i=>i.id===p.id))return toast("Already in cart");
  S.cart.push({id:p.id,shopId:s.id,shopName:s.name,shopPhone:s.phone,n:p.n,m:p.m,p:p.p,w:p.w,mk:p.mk});saveCart();tabs();toast("Added to cart")},
 rmcart:d=>{S.cart.splice(+d.k,1);saveCart();cartPg()},
 checkout:()=>{if(!S.me){toast("Sign in to continue");return $("auth").click()}checkoutPg()},
 place:()=>guard(async()=>{const n=val("cn"),ph=val("cp").replace(/\D/g,""),m=$("cm").value,dl=$("cd").value,ad=val("ca"),utr=$("cu")?val("cu"):"";
  if(!n||ph.length<10)return toast("Add your name and phone");
  if(dl==="home"&&!ad)return toast("Add your delivery address");
  if(m==="upi"&&!/^\d{12}$/.test(utr))return toast("Enter the 12-digit UPI reference");
  const c=S.cart[0],items=S.cart.map(i=>{const p=price(i);return{n:i.n,m:i.m,p:i.p,w:i.w,mk:i.mk,price:p?Math.round(p.t):0}}),total=items.reduce((a,i)=>a+i.price,0);
  if(!(total>0))return toast("Today’s rate is not set. Ask the shop.");
  await addDoc(collection(db,"orders"),{userId:S.me.uid,userName:n,userPhone:ph,shopId:c.shopId,shopName:c.shopName,shopPhone:c.shopPhone,items,total,method:m,utr:m==="upi"?utr:"",delivery:dl,address:ad,status:"placed",paid:false,t:Date.now(),updatedAt:Date.now()});
  S.cart=[];saveCart();toast("Order placed");await ordersPg()}),
 ost:d=>guard(async()=>{await updateDoc(doc(db,"orders",d.id),{status:d.s,updatedAt:Date.now()});await reOrders()}),
 opaid:d=>guard(async()=>{await updateDoc(doc(db,"orders",d.id),{paid:true,updatedAt:Date.now()});await reOrders()}),
 saveupi:()=>guard(async()=>{await updateDoc(doc(db,"shops",S.me.uid),{upiId:val("supi2")});await loadMine();toast("UPI ID saved")})
});
document.addEventListener("click",e=>{const t=e.target.closest("[data-a]");if(t&&act[t.dataset.a])act[t.dataset.a](t.dataset)});
$("auth").onclick=()=>guard(async()=>{S.me?await signOut(auth):await signInWithPopup(auth,new GoogleAuthProvider())});

onAuthStateChanged(auth,async u=>{S.me=u;S.admin=false;S.mine=null;
 if(u){try{await getDoc(doc(db,"admin","ping"));S.admin=true}catch(e){}try{await loadMine()}catch(e){}}
 tabs();if(["mine","admin","orders"].includes(S.view)){await act.go({v:S.view==="admin"?"mine":S.view})}else if(S.view==="home")home()});
guard(async()=>{await loadRate();await loadShops();home()});
const bot={h:[]};
const say=(x,me)=>{const d=document.createElement("div");d.className="bm"+(me?" me":"");d.textContent=x;$("bmsg").appendChild(d);$("bmsg").scrollTop=1e9;return d};
function rateText(){const g=S.rate.gold24;if(!g)return"Today’s rate has not been set yet. Please check again later.";
 return`Today’s gold: 24K ${inr(g)}/g, 22K ${inr(g*22/24)}/g, 18K ${inr(g*18/24)}/g`+(S.rate.silver?`, silver ${inr(S.rate.silver)}/g`:"")+(S.rateNote?` (${S.rateNote})`:"")+".\nMaking charge and 3% GST are extra. The shop gives the final price."}
function shopsText(){const l=S.shops.map(s=>({...s,d:dist(s)})).sort((a,b)=>(a.d??1e9)-(b.d??1e9)).slice(0,3);
 return l.length?"Verified shops"+(S.pos?" near you":"")+":\n"+l.map(s=>"• "+s.name+", "+s.area+(s.d!=null?" ("+s.d.toFixed(1)+" km)":"")).join("\n")+"\nOpen the Shops tab to browse their products.":"No verified shops yet. Jewellers can register under My shop."}
const FAQ=[
 [/rate|bhav|bhaav|sona|chandi|gold price|silver price/,rateText],
 [/shop|jeweller|jeweler|dukan|near/,shopsText],
 [/hallmark|huid|bis\b|certif/,()=>"Gold jewellery in India should carry a BIS hallmark with a 6-character HUID code. Ask the shop for the hallmark details and you can check them in the BIS Care app."],
 [/making|wastage|labou?r/,()=>"Making charge is what the jeweller charges for crafting, usually a percentage of the gold value (in this app, 8–15% is common). It varies by design, so you can compare shops and ask for a discount on it."],
 [/gst|tax/,()=>"Gold and silver jewellery attracts 3% GST. Our price estimate includes it. The final bill from the shop is what counts."],
 [/karat|carat|22k|24k|18k|purity/,()=>"24K is about 99.9% pure gold (soft, used for coins and bars). 22K is about 91.6% and is the usual choice for jewellery. 18K is 75% and is common for diamond and studded pieces."],
 [/order|buy|cart|upi|pay|checkout|delivery/,()=>"Open a product and tap Add to cart, then Checkout. You can pay at the shop on pickup, or pay by UPI directly to the shop and enter the UPI reference. Your money goes to the shop, not to JewelKart. Track it under Orders."]
];
async function askAI(q){if(!S.me)return"Sign in (top right) to chat with the AI assistant. I can still answer questions about rates, shops, hallmark, GST and ordering.";
 try{const tok=await S.me.getIdToken(),g=S.rate.gold24||0,ctx={rates:{gold24:g,gold22:g*22/24,gold18:g*18/24,silver:S.rate.silver||null},shops:S.shops.slice(0,10).map(s=>({name:String(s.name).slice(0,40),area:String(s.area).slice(0,40)}))};
  const r=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+tok},body:JSON.stringify({messages:bot.h.slice(-6).concat([{role:"user",content:q}]),context:ctx})});
  if(r.status===501)return"The AI assistant isn’t switched on yet. Try asking about gold rate, shops near me, hallmark, making charges or how to order.";
  if(r.status===429)return"You’ve asked a lot in a short time. Please try again in a while.";
  const j=await r.json();if(!r.ok)throw 0;return j.reply}catch(e){return"Sorry, I couldn’t answer that right now."}}
async function answer(q){const l=q.toLowerCase();for(const[re,fn]of FAQ)if(re.test(l))return fn();return askAI(q)}
async function sendBot(){const q=$("bin").value.trim();if(!q)return;$("bin").value="";say(q,true);const w=say("…");const a=await answer(q);w.textContent=a;bot.h.push({role:"user",content:q},{role:"assistant",content:a})}
$("botb").onclick=()=>{const p=$("bot");p.hidden=!p.hidden;if(!p.hidden&&!$("bmsg").children.length)say("Namaste! I’m the JewelKart assistant. Ask me about today’s gold rate, shops near you, hallmark, making charges or how to order.")};
$("bsend").onclick=sendBot;$("bin").onkeydown=e=>{if(e.key==="Enter")sendBot()};
Object.assign(act,{
 prevauto:()=>guard(async()=>{const j=await(await fetch("/api/rates")).json();if(!(j.gold24>0))return $("prevbox").textContent="Market rate is not available right now.";const a=+val("adj")||0;$("prevbox").textContent=`Market: gold 24K ${inr(j.gold24)}/g, silver ${j.silver?inr(j.silver)+"/g":"n/a"}. With ${a}%: gold 24K ${inr(j.gold24*(1+a/100))}/g. Compare with your local board rate and change the % until they match.`}),
 saverate:()=>guard(async()=>{const g=+val("g24"),s=+val("sv"),a=+val("adj")||0,auto=$("rm").value==="auto";if(!(g>0))return toast("Enter the manual gold rate (used if auto fails)");await setDoc(doc(db,"rates","today"),{gold24:g,silver:s>0?s:null,auto,adj:a,t:Date.now()});await loadRate();toast(auto?"Auto rate is on":"Rate saved")})
});
setInterval(()=>guard(loadRate),9e5);
if("serviceWorker" in navigator)navigator.serviceWorker.register("/sw.js").catch(()=>{});
</script>
